# Release on tag v*: multi-arch images to ghcr (what a default install pulls)
# plus a GitHub Release. GITHUB_TOKEN is enough for ghcr — no extra secret.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The layer cache rides GitHub's own cache service (type=gha), scoped per
      # image; with the Dockerfiles cross-compiling on $BUILDPLATFORM (no QEMU
      # for the compilers), a warm release is minutes, not the 40+ the emulated
      # builds took.
      - name: Build and push back
        uses: docker/build-push-action@v6
        with:
          context: back
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=back
          cache-to: type=gha,scope=back,mode=max
          tags: |
            ghcr.io/upcontrol-io/upcontrol-back:${{ github.ref_name }}
            ghcr.io/upcontrol-io/upcontrol-back:latest
      - name: Build and push front
        uses: docker/build-push-action@v6
        with:
          context: front
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max
          tags: |
            ghcr.io/upcontrol-io/upcontrol-front:${{ github.ref_name }}
            ghcr.io/upcontrol-io/upcontrol-front:latest

  release:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v5
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
