openapi: 3.0.3
info:
  title: upcontrol API
  version: 1.0.0
  description: |
    The front-facing contract for upcontrol. Generated into a strict Go server
    (oapi-codegen) and into TS types for `front/src/lib/api.d.ts`. Response
    shapes are pinned to `front/src/lib/mockData.ts` — a contract test
    (build-plan §2.7) checks each against golden JSON taken from the mocks.

    Rules from the plan (§4.4):
      - Version in the path (/v1), not a header.
      - Errors are one shape: `{error: {code, message, upgrade?}}`. The optional
      - Errors are one shape: `{error: {code, message, upgrade?}}`. The optional
        text reason. No `disabled`, no `navigate('/plan')`.
      - Pagination only on unbounded lists: incidents, logs. Monitors, channels
        and recipients are plan-bounded and returned whole.
      - `null` is never used for "no value": the field is omitted. "Zero is
        silence" — an absent field does not render.
      - All timestamps are RFC 3339 UTC.
      - `POST /i` and `POST /hooks/{provider}` are `x-hand-written: true`: they
        exist here for the /docs/api page but are implemented by hand (the
        generator's validation is forbidden on /i by §4.5).

servers:
  - url: http://localhost:5173
    description: local dev (front dev server proxies to ucapi)

# ---------------------------------------------------------------------------
# Common building blocks
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: uc_session
    apiKey:
      type: apiKey
      in: header
      name: X-Upcontrol-Key

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No session, or the key is not ours.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PaymentRequired:
      description: |
        A plan gate blocked the action. The `upgrade` object carries a text
        reason; the client routes this to its upgrade prompt. No other
        paid-wall path exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist or belongs to another tenant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict, for example a domain already connected to another account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited (always with Retry-After).
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: "plan_limit_exceeded" }
            message: { type: string }
            upgrade:
              type: object
              description: Present only on 402. Drives the client's upgrade prompt.
              required: [reason]
              properties:
                reason:
                  type: string
                  example: "Free allows 3 HTTP checks."
                plan:
                  type: string
                  example: "indie"
                  description: >-
                    The cheapest plan that lifts the limit, lowercased. Absent at
                    the top of the ladder: there the client shows the message
                    instead of the modal. The server names it from
                    plan_entitlement; the client never computes it.

    # --- account ------------------------------------------------------------
    Plan:
      type: string
      # Self-hosted is the OSS install's plan (UC_SELF_HOSTED=1): one generous
      # entitlement row, never purchasable, never on the pricing page.
      enum: [Free, Indie, Growth, Agency, Self-hosted]
    # The plan word is the whole of what the core knows about money: how it is
    # paid for (interval, renewal, the subscription itself) belongs to whatever
    # sells it, outside this contract.
    Account:
      type: object
      required: [id, name, email, initials, plan]
      properties:
        id: { type: string, example: "usr_1" }
        name: { type: string, example: "Anna Kovacs" }
        email: { type: string, format: email }
        initials: { type: string, example: "AK" }
        plan: { $ref: "#/components/schemas/Plan" }
        # The person's role in the CURRENT project (from project_member), not a
        # standing rank in the workspace: switching projects can change it. The
        # project's workspace owner always answers `login`; `notify` gates every
        # management write.
        role: { type: string, enum: [notify, login] }
    Project:
      type: object
      required: [id, domain, createdAt, owned]
      properties:
        id: { type: string, example: "prj_1" }
        domain: { type: string, example: "example.com" }
        createdAt: { type: string, format: date-time }
        owned:
          type: boolean
          description: >-
            Whether the session's person owns the workspace this project lives
            in. False inside a project somebody else owns, where the plan is a
            fact rather than a purchase and the owner-only doors are closed.
        ownerEmail:
          type: string
          format: email
          description: >-
            The workspace owner's address, sent for every project so a guest
            card can name whose it is.
    MeResponse:
      type: object
      required: [account, project]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        project:
          allOf:
            - $ref: "#/components/schemas/Project"
          nullable: true
          description: >-
            The tenant's current project, or null when the tenant has no projects
            (possible after a lost claim race or deleting the last project; Decision 15).
    # One row of GET /v1/projects: every project the person can reach, own ones
    # first, then the ones they were invited to. The id is the same public-id
    # encoding /v1/me's project carries, so the front's "current row" is an
    # equality check against me.project.id — no second source of that fact here.
    ProjectListItem:
      type: object
      required: [id, domain, createdAt, owned, role]
      properties:
        id: { type: string, example: "6f9619ff8b86d97111d1c1e4bba1f0b2" }
        domain: { type: string, example: "example.com" }
        createdAt: { type: string, format: date-time }
        owned:
          type: boolean
          description: Whether the caller owns the workspace this project lives in.
        role: { $ref: "#/components/schemas/RecipientRole" }
        ownerEmail:
          type: string
          format: email
          description: The workspace owner's address, so a guest row can name whose project it is.

    # --- dashboard / monitors ----------------------------------------------
    HealthStatus:
      type: string
      enum: [ok, check, down, nodata]
    Monitor:
      type: object
      required: [id, type, name, target, status, interval]
      properties:
        id: { type: string, example: "mon_1" }
        type:
          type: string
          enum: [Website, Heartbeat]
        name: { type: string }
        target: { type: string, example: "https://example.com" }
        status: { $ref: "#/components/schemas/HealthStatus" }
        interval: { type: string, example: "5m" }
        keyword:
          type: string
          description: Optional assertion on the response body ("Page must contain").
        expiry:
          type: object
          description: >
            SSL and domain expiry, pre-baked for display. Absent for heartbeat,
            and absent entirely until one of the two has been read. Each half is
            present only when there is a date for it — "domain —" says we have
            not looked yet, not when the domain expires, and the row printed it
            under every check whose certificate we already had.
          properties:
            ssl: { type: string, example: "SSL Nov 2, in 84 days" }
            domain: { type: string, example: "domain Mar 14, in 217 days" }
        pingUrl:
          type: string
          description: Heartbeat only. The URL the job calls on every run (GET or POST); absent for a website check.
    MonitorCreate:
      type: object
      required: [type, name, target, interval]
      properties:
        type:
          type: string
          enum: [Website, Heartbeat]
        name: { type: string }
        target: { type: string }
        keyword: { type: string }
        interval:
          type: string
          enum: ["1m", "5m", "30m", "1h"]
    MonitorPatch:
      type: object
      properties:
        name: { type: string }
        target: { type: string }
        keyword: { type: string }
        interval:
          type: string
          enum: ["1m", "5m", "30m", "1h"]
        paused: { type: boolean }

    # --- sources ------------------------------------------------------------
    Source:
      type: object
      required: [id, mark, name, status, lastSignal, paused]
      properties:
        id: { type: string }
        mark: { type: string, example: "URL" }
        kind:
          type: string
          example: "deployhooks"
          description: >-
            The connect tile this row came from. Absent on the derived sources
            (site checks, logs), which are facts about what arrived rather than
            connections. There is one connection per kind, so a tile whose key
            appears here is already connected and must not offer to add a second.
        name: { type: string }
        status: { $ref: "#/components/schemas/HealthStatus" }
        lastSignal: { type: string, example: "up · 4s ago" }
        paused: { type: boolean }
        hookToken:
          type: string
          example: "8f2ac41d9b0e4d6bb30d0f02d9101723"
          description: >-
            The connection's inbound-hook credential (universal hooks): the
            front renders {origin}/hooks/{hookToken}, and anything that can
            POST JSON to that URL lands as this project's events. Present on
            connection rows only — the derived sources have no inbound URL.
        lastEvent:
          type: string
          example: "github_push"
          description: >-
            The normalized name of the last event received on this
            connection's hook — the panel's receipt. Absent until the first
            event lands.
        duringIncident:
          type: object
          description: What this source reads like while the incident is open.
          required: [status, label]
          properties:
            status: { $ref: "#/components/schemas/HealthStatus" }
            label: { type: string }
    ConnectableSource:
      type: object
      required: [key, name, setupTime]
      properties:
        key: { type: string, example: "installer" }
        name: { type: string }
        setupTime: { type: string, example: "1 command" }
        installer:
          type: boolean
          description: Opens the installer card rather than connecting something.
        docs:
          {
            type: string,
            description: "A tile that leads nowhere is not an offer.",
          }
    SourcesResponse:
      type: object
      required: [sources, connectableSources]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/Source" }
        connectableSources:
          type: array
          items: { $ref: "#/components/schemas/ConnectableSource" }

    # --- keys ---------------------------------------------------------------
    ApiKey:
      type: object
      required: [id, prefix, createdAt, name, state]
      description: |
        One of the project's API keys. The full secret is never stored and never
        returned by a read — only this identifier (the prefix). The full key is
        returned exactly once, by the call that issues it.
      properties:
        id: { type: string, example: "key_1" }
        prefix: { type: string, example: "uc_live_8f2ac41d9b0e" }
        createdAt: { type: string, format: date-time }
        name:
          type: string
          description: "What the person called it. Empty is a real answer — every key issued before names existed has one, and the app falls back to the prefix."
          example: "staging"
        state:
          type: string
          enum: [active, rotating, revoked]
          description: "`rotating` is an old key inside its 24h overlap: still accepted, already replaced. `revoked` is never accepted again, and its row is kept because the last use of a withdrawn key is evidence."
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: "Null for a key nothing has ever presented."
        revokedAt:
          type: string
          format: date-time
          nullable: true
    IssuedKey:
      type: object
      required: [id, prefix, createdAt, value]
      description: |
        The answer of the two calls that issue a key — POST /v1/keys and
        POST /v1/keys/rotate — and the ONE place the full key ever appears.
        `value` is shown exactly once and is not retrievable again; `prefix` is
        what every later read lists instead.
      properties:
        id: { type: string, example: "key_2" }
        prefix: { type: string, example: "uc_live_8f2ac41d9b0e" }
        createdAt: { type: string, format: date-time }
        name: { type: string, example: "staging" }
        value: { type: string, example: "uc_live_8f2ac41d9b0e6c31a57f92d4" }
    KeyUsageEntry:
      type: object
      required: [time, endpoint, status]
      properties:
        time: { type: string, example: "15:12" }
        endpoint: { type: string, example: "POST /v1/event" }
        status: { type: integer, example: 202 }
    KeysResponse:
      type: object
      required: [key, keys, usage]
      properties:
        key:
          allOf: [{ $ref: "#/components/schemas/ApiKey" }]
          nullable: true
          description: >
            DEPRECATED, and kept only so a front older than the key list keeps
            working against a newer core: the newest key that is not revoked,
            exactly what this field has always meant. Read `keys` instead.
        keys:
          type: array
          description: "Every key of the current project, newest first, revoked ones included — a withdrawn key with a last use is the record of what happened."
          items: { $ref: "#/components/schemas/ApiKey" }
        usage:
          type: array
          items: { $ref: "#/components/schemas/KeyUsageEntry" }

    # --- channels / recipients ---------------------------------------------
    ChannelKind:
      type: string
      enum: [telegram, email, discord, slack, webhook]
    NotifySettings:
      type: object
      description: >
        What this channel is notified about (docs/plans/channel-notify-settings.md).
        The server stores keys sparsely (absent = default) but always RETURNS the
        resolved object, so a screen renders state, not guesses. These pick which
        classes of alert land on the destination — not a per-monitor matrix.
      required:
        [
          websiteDown,
          errorLogs,
          repeatingErrorLogs,
          repeatWindowMin,
          resolveFollowUp,
        ]
      properties:
        websiteDown:
          type: boolean
          description: The incident-open page. Default true — what already sends today.
        errorLogs:
          type: boolean
          description: >
            Every new error fingerprint in the log stream. One axis with
            repeatingErrorLogs (none / every new / only repeating): setting one
            true turns the other off, and a row carrying both resolves to the
            stricter repeating-only reading. Default false.
        repeatingErrorLogs:
          type: boolean
          description: >
            Only errors repeating inside repeatWindowMin — the noise filter.
            Mutually exclusive with errorLogs (see there). Default false.
        repeatWindowMin:
          type: integer
          minimum: 1
          maximum: 120
          description: The repeat window in minutes. Default 5.
        resolveFollowUp:
          type: boolean
          description: >
            Paid plans only: one follow-up 15 minutes after the page — "recovered"
            if the incident closed, "still down" if not. Setting it true on Free
            answers 402 plan_limit_exceeded with upgrade.reason.
    AlertChannel:
      type: object
      required: [id, kind, target]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/ChannelKind" }
        target: { type: string, description: "A handle, an address or a URL." }
        label:
          type: string
          description: >
            The Telegram chat's own name — a person's name (plus @username) or a
            group's title; absent when the channel has none, and the reader then
            sees the raw target.
        mutedUntil:
          type: string
          format: date-time
          description: >
            Present only while a /mute window is still running — the moment the
            channel's alerts resume; never sent for a channel that is live or a
            window that has already expired.
        note:
          type: string
          description: One extra line, only where the channel behaves differently.
        notify: { $ref: "#/components/schemas/NotifySettings" }
    ConnectableChannel:
      type: object
      required: [kind, name, field, hint]
      properties:
        kind: { $ref: "#/components/schemas/ChannelKind" }
        name: { type: string }
        field: { type: string, example: "Webhook URL" }
        placeholder:
          type: string
          description: Absent for a channel that is not added by typing an address.
        link:
          type: string
          description: >
            Telegram only: the deep link that connects a chat. A chat id cannot
            be typed into a form, so this channel is added by pressing Start —
            the bot binds the chat when it hears from you. Absent when no bot is
            configured, and then the Telegram tile is absent too.
        hint: { type: string }
    ChannelsResponse:
      type: object
      required: [channels, connectableChannels, undelivered]
      properties:
        channels:
          type: array
          items: { $ref: "#/components/schemas/AlertChannel" }
        connectableChannels:
          type: array
          items: { $ref: "#/components/schemas/ConnectableChannel" }
        undelivered:
          type: integer
          description: >
            Alert deliveries that died in the queue over the last 24 h (class
            `test` excluded — a failed test is already visible on its own row).
            Zero means nothing is silently undelivered; the Alerts screen says
            so out loud when it is not.
    DeliveryState:
      type: string
      enum: [pending, sent, dead]
      description: >
        The delivery queue's own vocabulary. `pending` covers leased/retrying
        too — to the reader the outcome is simply not known yet.
    DeliveryStatusResponse:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state: { $ref: "#/components/schemas/DeliveryState" }
        deadReason:
          type: string
          description: Present when state is `dead` — the reason the delivery died, shown to the owner.
    RecipientRole:
      type: string
      enum: [notify, login]
    Recipient:
      type: object
      required: [id, initials, name, role, status]
      properties:
        id: { type: string }
        initials: { type: string }
        name: { type: string }
        # Absent for a Telegram-only member: their identity is the chat, not an
        # address. The row then carries telegram: true instead.
        email: { type: string, format: email }
        telegram:
          type: boolean
          description: Present when this person is a verified Telegram recipient.
        role: { $ref: "#/components/schemas/RecipientRole" }
        status: { type: string, enum: [active, pending] }
        owner:
          type: boolean
          description: >-
            Present and true on the workspace owner's row, which has no role
            control and cannot be removed.
    TelegramInvite:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending] }
        personId:
          type: string
          description: >
            Present when the link is bound to one teammate's row (Link
            Telegram): the person's public id. The pending link then renders on
            that person's Team row, never in the Channels list, and its redeem
            links THAT person's Telegram instead of creating a second person.
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    TelegramInviteCreated:
      type: object
      required: [id, link, expiresAt]
      properties:
        id: { type: string }
        personId:
          type: string
          description: The minted link's binding, echoed from the request when set.
        link:
          type: string
          description: >
            `t.me/<bot>?start=inv_<token>` — the one-time deep link. The token
            appears exactly here and nowhere else: not in logs, not in telemetry,
            not retrievable after this response.
          example: "https://t.me/upcontrol_bot?start=inv_9f8e7d6c5b4a"
        expiresAt: { type: string, format: date-time }
    RecipientsResponse:
      type: object
      required: [recipients]
      properties:
        recipients:
          type: array
          items: { $ref: "#/components/schemas/Recipient" }
        telegramInvites:
          type: array
          description: Pending one-time invite links (token not yet redeemed).
          items: { $ref: "#/components/schemas/TelegramInvite" }
        telegramEnabled:
          type: boolean
          description: Absent when no Telegram bot is configured — the screen then offers e-mail only.

    # --- incidents ----------------------------------------------------------
    TimelineEventKind:
      type: string
      enum: [deploy, error, payment, check, people]
    TimelineEntry:
      type: object
      required: [time, ago, kind, text]
      properties:
        time: { type: string }
        ago: { type: string }
        kind: { $ref: "#/components/schemas/TimelineEventKind" }
        text: { type: string }
        dim:
          type: boolean
          description: Consequence-side events recede to body color.
    IncidentResult:
      type: object
      required: [status, text]
      properties:
        status: { type: string, enum: [fixed, "still-down"] }
        text: { type: string }
    Incident:
      type: object
      required:
        [
          id,
          title,
          status,
          since,
          durationMinutes,
          ongoing,
          timeline,
          logSlice,
          affectedCount,
        ]
      properties:
        id: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/HealthStatus" }
        since: { type: string }
        durationMinutes: { type: integer }
        ongoing: { type: boolean }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        logSlice:
          type: array
          items: { type: string }
        affectedCount: { type: integer }
        result:
          # Absent while the incident is open; null is never used.
          $ref: "#/components/schemas/IncidentResult"
        errorFirstSeenDaysAgo:
          type: integer
          description: First-seen of the error series, in days. Absent = no wall.
        historyDaysLeft:
          type: integer
          description: Days until this incident leaves Free's 30-day history.

    # --- logs ---------------------------------------------------------------
    LogLevel:
      type: string
      enum: [info, warn, error]
    # The live window's line, as it comes out of the ring: an absolute timestamp
    # and the seq that orders it. (The mock's LogLine carries offsetSec/time
    # instead, because it is generated relative to a frozen "now".)
    LogLine:
      type: object
      required: [seq, ts, level, message]
      properties:
        seq:
          {
            type: string,
            description: "Ring sequence number, as a string (it exceeds 2^53).",
          }
        ts: { type: string, format: date-time }
        level: { $ref: "#/components/schemas/LogLevel" }
        service: { type: string }
        message: { type: string }
    VolumeBucket:
      type: object
      required: [minute, level, lines]
      properties:
        minute: { type: string, format: date-time }
        level: { $ref: "#/components/schemas/LogLevel" }
        lines: { type: integer }
    DetailBucket:
      type: object
      required: [bucket, level, lines]
      properties:
        bucket:
          type: string
          format: date-time
          description: "Start of the bucket. Named for what it is rather than reusing `minute`: at five seconds a field called minute is a claim about precision nobody measured."
        level: { $ref: "#/components/schemas/LogLevel" }
        lines: { type: integer }
    VolumeDetail:
      type: object
      required: [bucketSeconds, buckets]
      properties:
        bucketSeconds:
          type: integer
          description: "The width actually used, which is not always the width asked for: the server snaps a request up to a size it can draw. Read it rather than assuming — the strip's columns are only as narrow as this says."
        buckets:
          type: array
          items: { $ref: "#/components/schemas/DetailBucket" }
    LogsResponse:
      type: object
      required: [lines, volume]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/LogLine" }
        volume:
          type: array
          items: { $ref: "#/components/schemas/VolumeBucket" }
        detail:
          $ref: "#/components/schemas/VolumeDetail"
          description: "Sub-minute counts inside `from`/`to`, present only when `bucketSeconds` asked for a width finer than the minute `volume` carries. It never replaces `volume`: that one spans the whole ring and is the map the range was picked on, and a map narrowed to the territory already chosen cannot get the reader back."
        total:
          type: integer
          description: "Lines in the window before the stream limit. The panel prints 'showing N of total' rather than implying the window is what fits on screen."
        services:
          type: array
          description: "The services present in the window, most lines first. Never narrowed by the `service` parameter — this is what the picker is built from, so filtering it would leave the reader holding their own choice and no way back."
          items: { $ref: "#/components/schemas/LogService" }
    LogService:
      type: object
      required: [name, lines]
      properties:
        name:
          type: string
          description: "The service label. Empty for lines that carried none."
        lines: { type: integer }

    # --- dashboard ----------------------------------------------------------
    DashboardMetricRef:
      type: object
      description: "What a widget draws: a source and the filter that narrows it. The front interprets it; the server keeps it."
      required: [source]
      properties:
        source:
          type: string
          enum: [logs, check, event, metric, service, funnel, experiment, retention, dimension]
        name: { type: string }
        where:
          type: object
          additionalProperties: { type: string }
        label: { type: string }
    DashboardWidget:
      type: object
      required: [id, kind, title, metrics, x, y, w, h]
      properties:
        id: { type: string, example: "w_1" }
        kind:
          type: string
          enum: [stat, line, bar, donut, logs, status, network, calendar, funnel, experiment, retention, breakdown]
        title: { type: string }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/DashboardMetricRef" }
        range:
          type: string
          enum: [1h, 4h, 12h, 24h, 7d, 31d]
          description: "Present only for kinds with a time axis."
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        w: { type: integer, minimum: 1, maximum: 12 }
        h: { type: integer, minimum: 1 }
    DashboardLayout:
      type: object
      description: "The whole board, on a 12-column grid: `x + w` never exceeds 12, ids are unique, and the document stays under 64 KB."
      required: [version, widgets]
      properties:
        version: { type: integer, enum: [1] }
        widgets:
          type: array
          items: { $ref: "#/components/schemas/DashboardWidget" }
    DashboardCatalog:
      type: object
      description: "What this project actually sent over the last 7 days. Every list is present and an empty one is a real answer: a project that sends nothing yet is not an error, and the board draws that as an empty picker rather than a failure."
      required:
        [services, groups, attrs, checks, events, metrics, funnels, experiments, retentions, dimensions]
      properties:
        services:
          type: array
          items: { $ref: "#/components/schemas/LogService" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/CatalogGroup" }
        attrs:
          type: array
          items: { $ref: "#/components/schemas/CatalogAttr" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/CatalogCheck" }
        events:
          type: array
          items: { $ref: "#/components/schemas/CatalogEvent" }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/CatalogMetric" }
        funnels:
          type: array
          items: { $ref: "#/components/schemas/CatalogFunnel" }
        experiments:
          type: array
          items: { $ref: "#/components/schemas/CatalogExperiment" }
        retentions:
          type: array
          items: { $ref: "#/components/schemas/CatalogRetention" }
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/CatalogDimension" }
    CatalogGroup:
      type: object
      description: "One message group: the lines of a service and level that share a fingerprint. This is what lets a card plot one specific kind of warning rather than every warning of a service."
      required: [service, level, fingerprint, sample, lines, lastTs]
      properties:
        service: { type: string }
        level: { $ref: "#/components/schemas/LogLevel" }
        fingerprint:
          type: string
          description: "Decimal text, not a number: the fingerprint is a uint64 and JSON would round it past 2^53."
        sample:
          type: string
          description: "The newest line of the group, capped at 200 characters — a label, not the line."
        lines: { type: integer }
        lastTs: { type: string, format: date-time }
    CatalogAttr:
      type: object
      description: "One attribute pair seen on a service's recent lines, counted over the newest lines of the window rather than all of them: expanding every line into one row per attribute is not what a picker is worth."
      required: [service, key, value, lines]
      properties:
        service: { type: string }
        key: { type: string }
        value: { type: string }
        lines: { type: integer }
    CatalogCheck:
      type: object
      description: "A monitor, in the same id and type shape GET /v1/monitors hands out."
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
    CatalogEvent:
      type: object
      required: [name, times, lastTs]
      properties:
        name: { type: string }
        times: { type: integer }
        lastTs: { type: string, format: date-time }
    CatalogMetric:
      type: object
      required: [name, readings, labels]
      properties:
        name: { type: string }
        readings: { type: integer }
        labels:
          type: array
          description: "The label keys seen on this metric's readings — what a widget can narrow it by."
          items: { type: string }
    CatalogFunnel:
      type: object
      description: "A funnel and its steps, ordered by the `i` label of each step's latest reading. A funnel is picked whole; its steps are read as one grouped series (`name: funnel`, `group: [funnel, step]`)."
      required: [name, steps]
      properties:
        name: { type: string }
        steps:
          type: array
          items: { type: string }
    CatalogExperiment:
      type: object
      description: "One A/B test the customer's agent reports: its name and its arms in the order they were declared, control first. The board orders the card's rows by this list."
      required: [name, variants]
      properties:
        name: { type: string }
        variants:
          type: array
          items: { type: string }
    CatalogRetention:
      type: object
      description: "One retention the customer's agent reports, and how many weekly cohorts it has sent. The grid itself is read through POST /v1/series."
      required: [name, cohorts]
      properties:
        name: { type: string }
        cohorts: { type: integer }
    CatalogDimension:
      type: object
      description: "One dimension the customer's agent reports, and how many distinct values it has sent. The ranking itself is read through POST /v1/series."
      required: [name, values]
      properties:
        name: { type: string }
        values: { type: integer }
    SeriesQuery:
      type: object
      description: "One widget's ask. `where` narrows the source — logs: service (the empty string is the unlabelled one), level, fingerprint, q, attr.<key>; check: check (the monitor's id); metric: label equalities. An unknown key is ignored, so a board saved against a newer front still draws."
      required: [id, source, range]
      properties:
        id:
          type: string
          description: "Echoed back on the answer; unique within the request, because that is how the client matches a series to the card that asked for it."
        source:
          type: string
          enum: [logs, check, event, metric]
        range:
          type: string
          enum: ["1h", "4h", "12h", "24h", "7d", "31d", "365d"]
        name:
          type: string
          description: "check: `response`, `uptime`, `dns`, `tcp`, `tls` or `wait`; event: the event name; metric: the metric name."
        where:
          type: object
          additionalProperties: { type: string }
        group:
          type: array
          maxItems: 2
          items: { type: string }
          description: "Label keys to fold the counter by, for the metric source only. With `group` the answer carries `rows` instead of a time series: a funnel's steps, an A/B test's variants, a retention grid's cohorts, a dimension's values. One read per card, whatever the label set turns out to hold."
    SeriesRequest:
      type: object
      description: "Every chart on the board in one round trip: a widget asks for one query per metric it draws, and the whole board renders from one answer."
      required: [queries]
      properties:
        queries:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: "#/components/schemas/SeriesQuery" }
    Series:
      type: object
      required: [id, from, to, step, points]
      properties:
        id: { type: string }
        from: { type: string, format: date-time }
        to:
          type: string
          format: date-time
          description: "Rounded UP to the next bucket boundary, so the last bucket is the current, partial one."
        step:
          type: integer
          description: "Bucket width in seconds. `points.length` × `step` is the span."
        points:
          type: array
          description: "One value per bucket, oldest first. `null` is a bucket with no reading — zero is silence for a gauge, while a count with nothing in it is a measured 0. A log count is `null` too for a bucket older than the project's oldest stored row (the rollup's first hour, or the ring's first line): nothing was there to count, which is not the same as counting nothing."
          items: { type: number, nullable: true }
        rows:
          type: array
          description: "Present only when the query carried `group`: the counter's increase over the range, one entry per label combination, ordered by value descending and capped at 200. `points` is empty on a grouped answer — the fold has no time axis, and a series of nulls would claim one."
          items: { $ref: "#/components/schemas/SeriesRow" }
        total:
          type: number
          nullable: true
          description: "The range as one number: a sum for a count, an average for a check's response time, the latest reading for a gauge."
        previous:
          type: number
          nullable: true
          description: "The same reading over the span before `from`, which is what a card's delta is measured against."
    SeriesResponse:
      type: object
      required: [series]
      properties:
        series:
          type: array
          items: { $ref: "#/components/schemas/Series" }
    SeriesRow:
      type: object
      required: [labels, value]
      properties:
        labels:
          type: object
          additionalProperties: { type: string }
        value: { type: number }

    # --- plan ---------------------------------------------------------------
    UsedMax:
      type: object
      required: [used, max]
      properties:
        used: { type: integer }
        max: { type: integer }
    LogWindow:
      # Depth, not consumption: the ring holds `lines` and nothing is ever "used
      # up" (backend-from-new-plan.md decision 0.3), so there is no remainder to
      # draw and the client renders this as a sentence.
      #
      # `wasApproxHours` used to sit here as a boolean, which is a shape its own
      # name contradicts — it was meant to be the ring's earlier depth in hours,
      # so the client could say "was ≈ 21 h in June". The server never computed
      # it and answered a hardcoded `true`, and the one client expression that
      # read it compared it as a number. Removed rather than typed correctly:
      # nothing measures an earlier reading, and a field nobody can fill is a
      # standing invitation to fill it with a guess.
      type: object
      required: [lines, approxHours]
      properties:
        lines: { type: integer }
        approxHours:
          type: number
          description: "The plan's window in hours (plan_entitlement.window_hours) — a plan fact, not a measurement of this tenant's log rate."
    PlanResponse:
      type: object
      required: [plan, httpChecks, logWindow, incidentHistoryDays]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        owned:
          type: boolean
          description: >
            Whether the caller owns the workspace whose plan this is; false
            inside a project somebody else owns, where the plan is a fact, not
            a purchase.
        minIntervalSec:
          type: integer
          example: 300
          description: >
            The fastest a check may run on this plan — 300 on Free, 60 on every
            paid one. The picker still offers the faster options and opens
            the upgrade prompt when one is chosen (a paid wall is never a
            disabled control); this number is only how it knows where the wall is.
        httpChecks: { $ref: "#/components/schemas/UsedMax" }
        logWindow: { $ref: "#/components/schemas/LogWindow" }
        telegramRecipients: { $ref: "#/components/schemas/UsedMax" }
        incidentHistoryDays: { type: integer }
        historyDays:
          type: integer
          description: >
            How far back the dashboard's series reach, in days
            (plan_entitlement.history_days). Absent when the plan is unlimited
            (Self-hosted). A `POST /v1/series` range wider than this is a 402,
            and the board reads this number first so it never asks for one.
            A depth, not a consumption: the client renders it as a sentence,
            and it counts from the day a plan is switched, since what an
            earlier plan did not keep cannot be sold back.
        projects:
          description: >
            Absent when the plan is unlimited (Self-hosted): a usage bar needs
            a remainder, and an unlimited axis has none to draw.
          allOf:
            - $ref: "#/components/schemas/UsedMax"
        telegramRooms:
          type: boolean
          description: >
            Whether Telegram groups and channels may connect as broadcast
            destinations (false on Free). The invite screen words its copy from
            this capability, never from the plan name; the enforcing wall is the
            bot's own refusal at redeem time.

    # --- status page / public ----------------------------------------------
    PublicComponent:
      type: object
      required: [key, name, shown, uptime, bars]
      properties:
        key:
          type: string
          description: The monitor's public id — a component IS a check.
        name: { type: string }
        shown: { type: boolean }
        uptime: { type: string, example: "99.99%" }
        bars:
          type: array
          description: >
            One status per bucket, oldest first. The page draws exactly this
            many bars and no more: the strip covers only what the monitor has
            actually measured. The window climbs 1-2-4-8-16-24 h as history
            accumulates, doubling the bar count at each rung, so what one bucket
            covers (`barSpanSec`) holds still while the bars get thinner.
          items: { $ref: "#/components/schemas/HealthStatus" }
        barSpanSec:
          type: integer
          example: 300
          description: >
            Seconds one bar covers: five minutes normally, the monitor's own
            check interval when that is longer, and wider on the top rungs where
            the bar count is capped. Multiply by the number of bars for the
            window the strip reaches, which is at most a day. The page prints
            its own axis from this number and must not assume a fixed bucket.
    StatusPageResponse:
      type: object
      required:
        [slug, title, components, showNetwork, showPoweredBy]
      properties:
        slug:
          type: string
          description: The public URL segment. Assigned by us, never taken from the body.
        title: { type: string }
        domain:
          type: string
          description: Custom domain, from the first paid plan. Empty until set.
        domainVerified:
          type: boolean
          description: >
            Whether the stored domain's DNS has been proven to point where we
            do. A domain that just changed starts false and is re-proven by
            POST /v1/status-page/domain/verify.
        components:
          type: array
          items: { $ref: "#/components/schemas/PublicComponent" }
        network:
          type: array
          items: { $ref: "#/components/schemas/NetworkTile" }
        showNetwork: { type: boolean }
        showPoweredBy:
          type: boolean
          description: >-
            Whether the "Powered by UpControl" credit is published. Honoured
            only on a self-hosted instance, where the AGPL copy is the
            operator's own to brand. The hosted service always publishes it:
            a plan buys the page's address, never the branding.
    NetworkTile:
      description: >
        One phase of the request, as a median over the last 24 h of successful
        probes: dns, tcp and response. Measured from the checks table (dns_ms /
        connect_ms / total_ms), never sample data — a phase that never ran (no
        lookup on a reused connection) is absent rather than reported as zero.
        The TLS handshake is measured and stored but deliberately NOT published
        as a tile (owner decision, 2026-08-27).
      type: object
      required: [label, value, note, status]
      properties:
        label: { type: string, example: "tcp" }
        value: { type: string, example: "35 ms" }
        note: { type: string, example: "connection" }
        status: { $ref: "#/components/schemas/WatchStatus" }
    StatusPageUpdate:
      type: object
      properties:
        title: { type: string }
        domain:
          type: string
          description: >-
            The host to serve the page on. Normalized server-side (scheme,
            path and port dropped); must be a subdomain — at least three
            labels — and not our own host. Empty clears it. Changing it
            re-locks verification; 402 when the plan carries no custom
            domains, 409 when another page already rides that host.
        shown:
          type: object
          additionalProperties: { type: boolean }
          description: Component key → published. Absent keys default to published.
        showNetwork: { type: boolean }
        showPoweredBy:
          type: boolean
          description: >-
            Whether the "Powered by UpControl" credit is published. Honoured
            only on a self-hosted instance, where the AGPL copy is the
            operator's own to brand. The hosted service always publishes it:
            a plan buys the page's address, never the branding.
    PublicIncident:
      type: object
      required: [title, since, ongoing]
      properties:
        title: { type: string }
        since: { type: string }
        status: { $ref: "#/components/schemas/HealthStatus" }
        ongoing: { type: boolean }
    PublicStatusResponse:
      type: object
      required: [components, incidents, updatedAt]
      properties:
        title: { type: string }
        components:
          type: array
          items: { $ref: "#/components/schemas/PublicComponent" }
        incidents:
          type: array
          items: { $ref: "#/components/schemas/PublicIncident" }
        network:
          description: Empty when the owner has the section switched off, or when nothing has been measured yet.
          type: array
          items: { $ref: "#/components/schemas/NetworkTile" }
        updatedAt: { type: string, format: date-time }
        poweredBy:
          description: >
            Whether the credit line is published. Only a self-hosted instance
            can answer false: on the hosted service a plan buys the page's
            address, never the branding, so this is always true there.
          type: boolean
        claimed:
          description: >
            Whether the page belongs to an account. Clients treat ABSENT as
            claimed (an older backend knows no claim controls): fail closed.
          type: boolean
        mine:
          description: >
            Present and true only when the viewer's session belongs to the
            page's tenant; absent = not the viewer's page.
          type: boolean
        hasCustomDomain:
          description: >
            Present and true only for the OWNER (same rule as `mine`), when this
            page already has a custom domain stored, verified or not. It exists
            so the owner's own view of the page on our link can stop offering an
            address they have already bought. A boolean rather than the domain
            itself: nothing on a public page needs to print that address, and a
            field that carries it invites a caller to.
          type: boolean

    # --- landing watch ------------------------------------------------------
    WatchStatus:
      type: string
      enum: [ok, check, down, nodata]
    WatchRow:
      type: object
      required: [id, name, meta, status]
      properties:
        id:
          description: >
            The row's absolute URL. It doubles as the identifier so WatchRequest
            can send the ticked ids straight back as `targets` — there is no
            lookup table in between, and the server re-validates every one.
          type: string
          example: "https://example.com/pricing"
        name: { type: string }
        meta: { type: string }
        status: { $ref: "#/components/schemas/WatchStatus" }
        recommended:
          description: >
            Whether this row is a sensible default to tick. Sent by the server so
            the client keeps no opinion of its own about what a good default is.
          type: boolean
    WatchGroup:
      type: object
      required: [title, source, rows]
      properties:
        title: { type: string }
        source: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/WatchRow" }
    NetworkCheck:
      type: object
      required: [label, value, note, status]
      properties:
        label: { type: string }
        value: { type: string }
        note: { type: string }
        status: { $ref: "#/components/schemas/WatchStatus" }
    ProbeStage:
      description: >
        One phase of the live request. Only measured phases are sent: an IP
        literal has no dns stage, a plaintext host has no tls stage. Absence
        means "never measured", never "took zero" (zero is silence, see the
        header rules) — the client shows unknown rather than 0 ms.

        The corollary is that a phase which WAS measured is sent even at
        `ms: 0`. `wait` and `html` are derived from timings already held, so
        they exist whenever a response arrived: a small single-page shell
        genuinely finishes in the same millisecond as its first byte, and
        dropping it would claim we never looked.
      type: object
      required: [label, ms]
      properties:
        label:
          description: >
            `wait` is the server thinking once the connection exists, NOT
            time-to-first-byte: TTFB is measured from the start of the request
            and already contains dns+tcp+tls, so emitting it here would make the
            bars sum past the total. Derived as ttfb-(dns+tcp+tls); `html` is
            the tail after the first byte. The stages sum to probe.total_ms.
          type: string
          enum: [dns, tcp, tls, wait, html]
        ms: { type: integer, format: int32, minimum: 0 }
    ProbeResult:
      description: >
        The raw outcome of the live request. Field names are snake_case here
        because that is the shape already on the wire; the rest of /v1 is
        camelCase.
      type: object
      required: [ok, status_code, total_ms, error_class]
      properties:
        ok: { type: boolean }
        status_code: { type: integer, format: int32 }
        total_ms: { type: integer, format: int32 }
        error_class: { type: string, example: "none" }
    CheckResponse:
      type: object
      required: [groups, networkChecks]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/WatchGroup" }
        networkChecks:
          description: >
            One row per fact the probe actually established. A fact it cannot
            measure yet (error page, security headers, health URL) is omitted,
            not faked — the landing renders those as unknown.
          type: array
          items: { $ref: "#/components/schemas/NetworkCheck" }
        stages:
          type: array
          items: { $ref: "#/components/schemas/ProbeStage" }
        probe:
          $ref: "#/components/schemas/ProbeResult"
        watchLimit:
          description: >
            How many of these rows a new account may actually watch, from the
            free plan's http_checks entitlement. Sent because plan numbers live
            in one place; a client that hardcoded it would be a second source
            for a number Pricing already owns.
          type: integer
          format: int32
          example: 3
        claimedSlug:
          description: >
            Present only when the host already has a CLAIMED status page — the
            landing then opens it instead of promising a watch it cannot
            perform.
          type: string
    WatchRequest:
      type: object
      required: [host]
      properties:
        host: { type: string, example: "example.com" }
        email:
          description: >
            Optional. With an address the call provisions the account and
            mails a sign-in code; without one it creates or reuses the host's
            public status page.
          type: string
          format: email
        targets:
          description: >
            The ticked rows' ids (absolute URLs) to watch alongside the host.
            Untrusted: the server keeps only the ones on `host` and creates no
            more than the plan allows. Absent means "just the host".
          type: array
          items: { type: string }
          example: ["https://example.com/pricing"]
    WatchResponse:
      type: object
      required: [statusUrl]
      properties:
        statusUrl: { type: string, example: "https://status.example.com" }
        slug: { type: string, example: "prj-42" }
        watching:
          description: How many checks now exist, after the plan's ceiling applied.
          type: integer
          format: int32
        login:
          $ref: "#/components/schemas/WatchLogin"
    WatchLogin:
      description: >
        How the visitor gets into the account this call just created. On the
        e-mail path a magic-link code is always issued; in prod it is delivered
        by email and this object is empty, because returning a login token to
        an anonymous caller who typed somebody else's address is account
        takeover. In dev the code rides the response so the flow works without
        an inbox — the same relaxation POST /v1/auth/magic-link makes.
      type: object
      properties:
        dev_token:
          description: Dev builds only. Redeem via POST /v1/auth/magic-link.
          type: string

    # --- overview (dashboard aggregate) ------------------------------------
    Metric:
      type: object
      required: [label, value, note, spark]
      properties:
        label: { type: string }
        value: { type: string }
        note: { type: string }
        spark:
          type: array
          items: { type: number }
    LadderRung:
      type: object
      required: [key, title, done]
      properties:
        key: { type: string }
        title: { type: string }
        done: { type: boolean }
    OverviewResponse:
      type: object
      required: [sources, monitors, metrics, ladder]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/Source" }
        monitors:
          type: array
          items: { $ref: "#/components/schemas/Monitor" }
        incident:
          description: Absent when nothing is open.
          allOf:
            - $ref: "#/components/schemas/Incident"
        metrics:
          type: array
          items: { $ref: "#/components/schemas/Metric" }
        uptime:
          type: object
          description: >
            Availability over the last 24 h, measured. It is NOT one of `metrics`
            — those are the product tiles (sign-ups, latency), and with them
            hidden by the MVP trim the uptime card was the only one left, so the
            grid stretched it into a full-width banner holding one bare number.
            The Dashboard prints it in its calm line instead. Absent when no
            check has run in the window: 100% for a probe that never ran is the
            one number a monitoring product may not make up.
          required: [value, note]
          properties:
            value: { type: string, example: "99.98%" }
            note: { type: string, example: "last 24h" }
        ladder:
          type: array
          items: { $ref: "#/components/schemas/LadderRung" }
        health:
          description: >
            The 7-day health line: 42 four-hour segments ending now, computed
            from the checks table (which keeps exactly 7 days). Absent when the
            tenant has no checks at all — the line is a record of what was
            observed, so with nothing observed there is no line to draw.
          $ref: "#/components/schemas/HealthLine"

    HealthLine:
      type: object
      required: [uptimeLabel, segments]
      properties:
        uptimeLabel: { type: string }
        segments:
          type: array
          items: { $ref: "#/components/schemas/HealthStatus" }

    # --- ingest receipt (POST /i) -----------------------------------------
    IngestWarning:
      type: object
      required: [code, count]
      properties:
        code:
          type: string
          enum:
            - ts_absent
            - level_unknown
            - key_in_body
            - field_cap_exceeded
            - scrubbed
            - reserved_prefix
            - cardinality_capped
            - attr_key_capped
            - late_arrival
            - sampling_raised
            - class_shed
        count: { type: integer }
    IngestReceipt:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer }
        metrics:
          type: integer
          description: >-
            Lines recognised as metric readings (metric+value) rather than log
            lines, counted separately so a mixed batch stays legible.
        warnings:
          type: array
          items: { $ref: "#/components/schemas/IngestWarning" }
        sampling:
          type: object
          description: Present when the server instructed the client to sample.
          required: [level, keep]
          properties:
            level: { type: string, enum: [debug, info, warn, error] }
            keep: { type: number, description: "0.0–1.0 fraction to keep." }

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  /health:
    get:
      tags: [platform]
      summary: Liveness + readiness (combined).
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  checks: { type: object }
        "503":
          description: A dependency is down.

  /v1/auth/telegram:
    post:
      tags: [auth]
      summary: Sign in / up via Telegram Mini App initData.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initData]
              properties:
                initData: { type: string }
      responses:
        "200":
          description: Signed in; uc_session cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Account" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/google:
    post:
      tags: [auth]
      summary: Sign in / up via Google OAuth code.
      description: >
        Exchanges a one-time authorization code for a session. The code is
        exchanged server-side with the client secret; a token minted in the
        browser is never accepted. redirect_uri must be one the deployment
        published (UC_GOOGLE_REDIRECT_URIS) and must be the same value the
        browser sent to Google. code_verifier is the PKCE verifier when the
        page used one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirect_uri]
              properties:
                code: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string }
      responses:
        "200":
          description: Signed in; uc_session cookie set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Account" } },
            }
        "400":
          description: >
            bad_body, missing_code, or bad_redirect_uri — the redirect_uri is
            not one this deployment published.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: >
            google_not_configured — this instance has no Google client, so the
            magic link is the way in.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }

  /v1/auth/magic-link:
    post:
      tags: [auth]
      summary: Request or redeem a magic link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                token:
                  type: string
                  description: Present when redeeming the link, absent when requesting.
      responses:
        "202":
          description: Link sent (always, to avoid email enumeration).
        "200":
          description: Redeemed; uc_session cookie set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Account" } },
            }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session cookie.
      responses:
        "204": { description: Logged out. }

  /v1/me:
    get:
      tags: [auth]
      summary: The account + active project. Called by every app screen on load.
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MeResponse" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/overview:
    get:
      tags: [dashboard]
      summary: The Dashboard aggregate.
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/OverviewResponse" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/monitors:
    get:
      tags: [monitors]
      summary: All monitors (plan-bounded, returned whole — no pagination).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Monitor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [monitors]
      summary: Create a monitor.
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/MonitorCreate" } },
          }
      responses:
        "201":
          description: Created
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Monitor" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /v1/checks/{id}:
    patch:
      tags: [monitors]
      summary: |
        Alias of PATCH /v1/monitors/{id} (audit §6): the docs say "check"
        because a component IS a check — the endpoint they name has to exist.
        Same handler, same semantics; agents and external clients may use
        either path.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/MonitorPatch" } },
          }
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Monitor" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/monitors/{id}:
    patch:
      tags: [monitors]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/MonitorPatch" } },
          }
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Monitor" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [monitors]
      summary: |
        Delete a monitor. A check can be deleted (a typo in the third URL on Free
        must not occupy a slot forever); deletion asks first in the UI.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sources:
    get:
      tags: [sources]
      summary: Connected sources + what is still connectable.
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/SourcesResponse" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/sources/{kind}/connect:
    post:
      tags: [sources]
      summary: Connect a source (e.g. deployhooks, grafana).
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Source" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /v1/sources/{id}:
    patch:
      tags: [sources]
      summary: Pause or resume a connected source.
      description: >
        Pausing keeps the row and stops reading it. Only sources the tenant
        connected can be paused: `src_checks` and `src_logs` are derived from
        what has arrived and answer 400.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, paused]
                properties:
                  id: { type: string }
                  paused: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [sources]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Disconnected. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/export:
    get:
      tags: [account]
      summary: Everything this account owns, as one JSON document.
      description: >
        Checks, incidents (with their frozen log slices), channels and people.
        Secrets are never included: an export is a copy of the record, not of
        the credentials. The workspace owner only: a takeout is the whole
        account, which a guest invited to one project may not read.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not the workspace owner (`owner_only`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/project:
    delete:
      tags: [account]
      summary: Remove the session's current project from the account, releasing its status page.
      description: >
        Irreversible for the ACCOUNT: the current project leaves it, its
        monitors stop and the owner's API key is destroyed. Other projects in
        the tenant are untouched and the session survives, falling back to the
        tenant's lowest project. When the current project is the LAST one the
        tenant is deleted too — that is how an account is closed — and only
        then is the session cookie cleared. `accountDeleted` reports which of
        the two happened: the caller's project count was read before the write,
        and a destructive action is the last place to let the client guess.


        The project's STATUS PAGE is not destroyed. It moves to a fresh
        unclaimed tenant, keeping its slug and its address, so a link somebody
        already holds still resolves and anyone may claim the page again
        through `POST /v1/claim`. Its channels, invites and team rows are
        removed with the project; the released page alerts nobody and stops
        probing, and the reaper collects it if nobody claims it.
      responses:
        "200":
          description: Deleted. `accountDeleted` true means the session cookie was cleared too.
          content:
            application/json:
              schema:
                type: object
                required: [accountDeleted]
                properties:
                  accountDeleted: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            Not the workspace owner (`owner_only`). A guest invited to the
            project, even with the `login` role, cannot delete it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/projects:
    get:
      tags: [account]
      summary: Every project the caller can reach, their own first.
      description: >
        Their own workspace's projects first, oldest first, then the ones they
        were invited to. Each row carries `owned`, the caller's `role` in that
        project and the workspace's `ownerEmail`, so a guest row can say whose
        project it is. The projects axis (plan-limited: Free 1, Indie 2, Growth
        5, Agency 10, self-hosted unlimited) counts only the caller's own.
        No `current` flag rides these rows: the current project's id already
        comes from /v1/me, and a second source for the same fact is how the two
        start disagreeing.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/ProjectListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [account]
      summary: Create a project in the caller's own workspace and switch the session to it.
      description: >
        Always in the caller's OWN workspace, created on first use when they
        have none: a project is never added to somebody else's. Provisions what
        a project needs to receive logs from the first minute: the project row,
        its project_seq and an active API key. That workspace's plan is the
        gate and it runs first (402 with the cheapest lifting plan in
        `upgrade.plan`); on success the session points at the new project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, example: "example.com" }
      responses:
        "200":
          description: Created; the row as GET /v1/projects would list it.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ProjectListItem" } },
            }
        "400":
          description: Missing domain (`missing_domain`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /v1/project/switch:
    post:
      tags: [account]
      summary: Point this session at any project the caller can reach.
      description: >
        The switcher's per-row action. The id must be one GET /v1/projects
        listed — their own or one they were invited to; the session's workspace
        follows the project, so switching into a shared one moves the whole
        scope with it. Anything else, whether a stranger's, stale or unknown,
        is the same 404 `unknown_project`, so the endpoint never confirms which
        ids exist. Single-user (self-host) sessions have no session row: the
        call answers 204 without writing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, example: "prj_1" }
      responses:
        "204": { description: Switched (a single-user session has no row to write). }
        "400": { description: "`missing_project_id` — the body carried no id, or would not parse." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not one of this tenant's projects (`unknown_project`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/keys:
    get:
      tags: [sources]
      summary: The project's API keys + recent usage (Sources #key).
      description: >
        A project keeps a SET of keys, not one key it rotates: one per
        environment, one per service, and a leaked one withdrawn without
        touching the others. Revoked keys stay in the list, because the last use
        of a withdrawn key is what tells you what it reached before you noticed.
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/KeysResponse" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [sources]
      summary: Issue another key for the current project.
      description: >
        The full key is in the answer and nowhere else, ever again. A project is
        capped at 10 keys that still work (active or rotating); revoked ones do
        not count, so the cap is on live credentials rather than on history. The
        cap is a fixed number and NOT a plan axis: there is no key row in
        Pricing, so there is no wall.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 60
                  description: "What to call it, so two keys are told apart by something other than their prefix. Empty is allowed and prints as the prefix."
                  example: "staging"
      responses:
        "201":
          description: Issued; the full key is returned exactly once.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/IssuedKey" } },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: notify_role }
        "409":
          description: >
            `key_limit`: the project already holds 10 keys that work. Revoke one
            first. This is a fixed ceiling, never a 402 — no plan buys more.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/keys/{id}:
    delete:
      tags: [sources]
      summary: Revoke one key.
      description: >
        The key stops being accepted at once — there is no overlap window,
        because withdrawing a key is what you do when it leaked. The row is kept
        and marked, never deleted: `lastUsedAt` on a revoked key is evidence.
        Revoking the last one is allowed and leaves the project unable to ingest
        until another is issued; refusing it would be guessing at what the owner
        meant.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: "key_2" }
      responses:
        "204": { description: Revoked, or already was. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: notify_role }
        "404":
          description: No such key in the current project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/keys/rotate:
    post:
      tags: [sources]
      summary: |
        Rotate every working key of the project at once. Each stays valid for a
        24h overlap window, then 401s — a rotation that kills a deployed app
        fails at the customer.
      description: >
        Sugar over the two calls below, kept because "I just leaked it" wants one
        button: it marks every ACTIVE key of the project `rotating` and issues one
        replacement. To withdraw ONE key without touching the others, revoke it
        with DELETE /v1/keys/{id} and issue its replacement with POST /v1/keys.
      responses:
        "200":
          description: Rotated; the new key is returned.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/IssuedKey" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/channels:
    get:
      tags: [alerts]
      summary: Connected channels + what is still connectable.
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ChannelsResponse" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [alerts]
      summary: Add a channel (one field — a destination and nothing else).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, target]
              properties:
                kind: { $ref: "#/components/schemas/ChannelKind" }
                target: { type: string }
      responses:
        "201":
          description: Created
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/AlertChannel" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/channels/{id}:
    patch:
      tags: [alerts]
      summary: Change what the channel is notified about.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notify: { $ref: "#/components/schemas/NotifySettings" }
                muted: { type: boolean, description: "Only false is accepted: lifts the /mute window and releases the alerts it parked." }
      responses:
        "200":
          description: Updated; the resolved settings are returned.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/AlertChannel" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [alerts]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/telegram/invites:
    post:
      tags: [alerts]
      summary: >
        Mint a one-time Telegram invite link. The invite carries no role: the
        invitee arrives as notify. Counts active + pending recipients against
        the plan's telegram_recipients axis.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                personId:
                  type: string
                  description: >
                    Bind the invite to one person on the project; absent means
                    anyone holding the link may redeem it.
      responses:
        "201":
          description: Created — the link carries the token exactly once.
          content:
            application/json:
              { schema: { $ref: "#/components/schemas/TelegramInviteCreated" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /v1/telegram/invites/{id}:
    delete:
      tags: [alerts]
      summary: Burn an unredeemed invite (it can no longer be redeemed).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Burned. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/channels/{id}/test:
    post:
      tags: [alerts]
      summary: Send a test through the production queue (new-plan §6).
      description: >
        Queues a real delivery and answers with its queue id, so the caller can
        poll GET /v1/deliveries/{id} for the OUTCOME. `sent` is a fact the
        delivery pipeline reports, never something this endpoint promises on
        the queue's behalf.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Queued — the delivery's id is in the body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryStatusResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/deliveries/{id}:
    get:
      tags: [alerts]
      summary: One delivery's outcome, from the queue itself.
      description: >
        The honest answer behind "Send test" (prod audit §3): a delivery is
        `sent` only when the queue row says so, and `dead` carries the reason it
        died. Anything else means the outcome is not known yet.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryStatusResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/recipients:
    get:
      tags: [alerts]
      summary: People, Telegram members and pending invite links (the growth loop).
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/RecipientsResponse" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [alerts]
      summary: Invite a person (role chosen at invite, default notify).
      description: >
        The invite lands in the session's CURRENT project, not in the whole
        workspace: a teammate sees the projects they were invited to and
        nothing else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/RecipientRole" }
      responses:
        "201":
          description: Created (pending until accepted).
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Recipient" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/recipients/{id}:
    patch:
      tags: [alerts]
      summary: Change a recipient's role (the owner row carries no role control).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/RecipientRole" }
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Recipient" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [alerts]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/recipients/{id}/resend:
    post:
      tags: [alerts]
      summary: >-
        Mail the invitation again (Decision 17). Only a pending membership is
        a target; nothing is inserted, so a failed send leaves the state it
        found.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202":
          description: >-
            Accepted, empty body — the mail left.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            no_such_person — the id is not a pending member of this tenant.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
        "429":
          description: >-
            rate_limited — a live code is still inside the address's cooldown
            window, or the caller's IP is past the shared magic-link window.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
        "503":
          description: email_unavailable — the invitation mail did not leave.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }

  /v1/incidents:
    get:
      tags: [incidents]
      summary: Incident history (newest first). Returns the latest 20.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/incidents/{id}:
    get:
      tags: [incidents]
      summary: One incident with its timeline, log slice and result.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Incident" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instance/telegram-bot:
    put:
      tags: [instance]
      summary: >-
        Self-host only (the hosted cloud answers 404): store the Telegram
        bot's token and username. Sealed under UC_SECRET_KEY_HEX before it
        lands in Postgres, and never returned. Alerts pick the
        token up on the next send and the Channels/recipients surfaces
        appear immediately; the bot's /start linking and Mini App sign-in
        bind at boot, so they follow on the next restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username]
              properties:
                token:
                  type: string
                  description: The token exactly as @BotFather printed it.
                username:
                  type: string
                  description: The bot's username, with or without the leading @.
      responses:
        "204": { description: Stored. }
        "400": { description: invalid_token / invalid_username — shape refusals with the fix in the message. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: notify_role }
        "404": { description: Not a self-host. }
        "503": { description: secret_key_missing — no UC_SECRET_KEY_HEX to seal with. }
    delete:
      tags: [instance]
      summary: >-
        Self-host only: remove the Settings-set bot token and username. Env
        config, if any, takes over; otherwise the Telegram surface folds
        away.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: notify_role }
        "404": { description: Not a self-host. }

  /v1/instance/smtp:
    put:
      tags: [instance]
      summary: >-
        Self-host only (the hosted cloud answers 404): store the SMTP relay
        for sign-in mail and email alerts. Each field optional — send only
        what changes — sealed under UC_SECRET_KEY_HEX, resolved per message, so a
        saved relay works with no restart. Values are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                  description: Relay hostname alone (no scheme, no port), like smtp.eu.mailgun.org.
                port:
                  type: string
                  description: "Relay port as a string; usually 587 (STARTTLS) or 465. Default: 587."
                username:
                  type: string
                  description: Relay login, often the sending address itself.
                password:
                  type: string
                  description: Relay password or app password.
                from:
                  type: string
                  description: The From address; most relays insist it is a verified one.
      responses:
        "204": { description: Stored. }
        "400": { description: invalid_host / invalid_port / invalid_username / invalid_password / invalid_from / nothing_to_store — refusals with the fix in the message. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: notify_role }
        "404": { description: Not a self-host. }
        "503": { description: secret_key_missing — no UC_SECRET_KEY_HEX to seal with. }
    delete:
      tags: [instance]
      summary: >-
        Self-host only: remove every Settings-set SMTP value. Env config
        (UC_SMTP_*), if any, takes over; otherwise email is off and sign-in
        codes land in the ucapi log again.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: notify_role }
        "404": { description: Not a self-host. }

  /v1/logs:
    get:
      tags: [logs]
      summary: A bounded window of logs, not an explorer (product-plan).
      parameters:
        - in: query
          name: window
          description: >
            A trailing window for `total` and `services`, kept from before the
            timeline existed. An explicit `from`/`to` always wins: the two are
            the same question asked twice, and honouring both would count a
            slice of a slice.
          schema:
            { type: string, enum: ["5m", "15m", "30m", "1h", "2h", "24h"] }
        - in: query
          name: level
          description: >
            Repeatable. Any combination of the panel's three buckets; `info`
            covers every line that is neither an error nor a warning (debug
            included). Absent means every level.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: ["error", "warn", "info"] }
        - in: query
          name: from
          description: >
            Start of the range the reader picked on the timeline, inclusive.
            Narrows `lines` and `total` only — `volume` and `services` are
            deliberately NOT narrowed, because the strip is the map the range is
            picked on and a map that shrinks to the territory already chosen
            cannot get the reader back. Unparseable values are ignored rather
            than defaulted: a bad timestamp must not invent a narrower window
            than was asked for.
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: >
            End of the range, exclusive. Independent of `from` — either bound
            may be sent alone. A range that does not move forwards is dropped
            whole; it is a bug on the wire, not a request for zero lines.
          schema: { type: string, format: date-time }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: service
          description: >
            Repeatable. The window narrows to lines from any of the named
            services; an empty value means the unlabelled service. Absent means
            every service.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - in: query
          name: bucketSeconds
          description: >
            Ask for sub-minute resolution inside `from`/`to`, returned as
            `detail`. Both bounds are required — detail is what one minute of
            the map is made of, so there has to be a minute it belongs to. The
            value is a request, not a promise: the server snaps it up to a width
            it can draw and answers with the one it used, and omits `detail`
            entirely when every width it could offer would be coarser than the
            minute `volume` already carries. Anything unparseable or not
            positive means no detail, which is also what a client that never
            asked receives.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/LogsResponse" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard:
    get:
      tags: [dashboard]
      security:
        - cookieAuth: []
      x-hand-written: true
      summary: The stored board of the session's current project.
      description: >
        One layout per project, whatever the board last saved. A project that
        never saved one answers an empty layout, never a 404: the front reads a
        404 as a core without this endpoint and keeps the layout in the browser.
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/DashboardLayout" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [dashboard]
      security:
        - cookieAuth: []
        - apiKey: []
      x-hand-written: true
      summary: Replace the board of the session's current project, or lay down a first one with a key.
      description: >
        With a session: the whole layout, overwritten whole; last write wins.
        Only the envelope is validated (the version, the ids, the kinds, the
        grid), because a widget's refs are the front's own to interpret. A
        notify member may read the board and may not write it.


        With an ingest key instead (`X-Upcontrol-Key` or a bearer), this is the
        agent's one door into the board and it opens once: the key may store a
        layout for a project that has none, and a project that already has a
        row answers 409 `board_exists`. That is deliberately narrow — the key
        lives in `.env` on every server the customer deploys, so one that could
        replace a curated board would be a wipe waiting to leak. It grants no
        read of any kind, here or anywhere: the agent knows what it declared,
        so it needs no catalog to build the first board from.
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/DashboardLayout" } },
          }
      responses:
        "200":
          description: The layout as stored.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/DashboardLayout" } },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: notify_role }
        "404":
          description: The tenant holds no project, so there is nothing to keep a board for.
        "409":
          description: >
            `board_exists`. Key-authenticated only: this project already has a
            board, and a key may lay down the first one alone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/dashboard/catalog:
    get:
      tags: [dashboard]
      security:
        - cookieAuth: []
      x-hand-written: true
      summary: >
        What this project actually sent over the last 7 days, so a board widget
        is picked from real names rather than typed from memory: the services,
        the message groups inside them, the attribute pairs those lines carry,
        the tenant's checks, and the event, metric and funnel names. Every list
        is present and an empty one is a real answer — a project that has sent
        nothing is not an error, it is a project with an empty picker.
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/DashboardCatalog" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: >
            A read behind one of the lists failed (`read_failed`). No partial
            catalog is returned: an empty list is a claim about the project,
            and a list left short by a broken read would make that claim
            without measuring it.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }

  /v1/series:
    post:
      tags: [dashboard]
      security:
        - cookieAuth: []
      x-hand-written: true
      summary: >
        Every chart on the board in one round trip. Each query names a source, a
        range and the filter that narrows it, and comes back as one bucketed
        series with the range's total and the same reading over the span before
        it. A POST because the ask is a body, not because anything is written.
        An empty project answers zeros and nulls, never a 404: a board drawn
        before the first line arrives is the normal first view. A range wider
        than the plan's `historyDays` is a 402 for the whole request, in the
        upgrade shape every other wall uses: the board reads the plan first
        and never asks past it, so the 402 is the gate, not the wall's copy.
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/SeriesRequest" } },
          }
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/SeriesResponse" } },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "500":
          description: >
            A read behind one of the queries failed (`read_failed`). No partial
            body: zeros and nulls mean measured silence here, so a chart drawn
            from a dead read would print a number nobody took.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }

  /v1/plan:
    get:
      tags: [plan]
      summary: Plan numbers (single-sourced with Pricing.tsx — no invented gates).
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/PlanResponse" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/status-page:
    get:
      tags: [statuspage]
      summary: What this tenant publishes, with measured uptime per component.
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/StatusPageResponse" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [statuspage]
      summary: Save what the page publishes.
      description: >
        Only the owner's decisions are stored — which components are published,
        the title, the domain and the section switches. The components are the
        tenant's checks and their uptime is measured, so neither is accepted here.
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/StatusPageUpdate" } },
          }
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/StatusPageResponse" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/status-page/domain/verify:
    post:
      tags: [statuspage]
      summary: Re-check the stored domain's DNS against our own host.
      description: >
        Resolves the stored domain and our own origin's host and compares the
        answers: verified means they intersect, so a CNAME a DNS provider
        flattens still passes. DNS that is not ready yet answers 200 with
        verified:false — the customer re-runs it, nothing is broken.
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [domain, verified],
                      properties:
                        {
                          domain: { type: string },
                          verified: { type: boolean },
                        },
                    },
                },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- public (no auth) ----------------------------------------------------
  /public/status:
    get:
      tags: [public]
      security: []
      summary: The status page for a custom domain, resolved by the Host header.
      description: >
        The tenant is the one whose domain column equals the request's Host
        header (lowercased, port stripped), and only a verified domain
        answers. A host that matches nothing — or matches a domain we have
        not proven — gets the same 404 as an unknown slug.
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/PublicStatusResponse" },
                },
            }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/status/{slug}:
    get:
      tags: [public]
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/PublicStatusResponse" },
                },
            }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/ping/{token}:
    get:
      tags: [public]
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recorded.
          content:
            text/plain:
              schema: { type: string, example: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [public]
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recorded.
          content:
            text/plain:
              schema: { type: string, example: OK }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/check:
    post:
      tags: [public]
      security: []
      summary: Probe a host (rate-limited per IP, cached per domain).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string, example: "example.com" }
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CheckResponse" } },
            }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/watch:
    post:
      tags: [public]
      security: []
      summary: Start watching a host; sends a confirmation email (7-day pending TTL).
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/WatchRequest" } },
          }
      responses:
        "200":
          description: OK
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/WatchResponse" } },
            }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/projects/anonymous:
    post:
      tags: [install]
      security: []
      x-hand-written: true
      summary: |
        Mint an anonymous project (cli/SPEC.md §7.1): tenant + project + API key
        with no person attached, so `npx upcontrol init` works before signup.
        The body carries CLI/agent versions only — no email, no hostname, no
        paths. The key rides the response exactly once; the claim token is the
        one-time proof that later attaches a signed-in person to the tenant.
        Claiming never changes the key. Per-IP throttled.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cli_version: { type: string }
                agent_version: { type: string }
                platform: { type: string }
                arch: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [projectId, key, claimToken, claimUrl]
                properties:
                  projectId: { type: string }
                  key: { type: string, description: Shown exactly once. }
                  claimToken: { type: string }
                  claimUrl: { type: string }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/claim:
    post:
      tags: [install]
      x-hand-written: true
      summary: |
        Attach the signed-in person to the anonymous tenant the claim token
        names (cli/SPEC.md §7.3). One-time: the token hash is cleared on
        success. Idempotent for an already-claimed member only via membership's
        ON CONFLICT; an unknown or spent token is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Exactly one of claimToken or slug; when both arrive the token
                wins and the slug is ignored. The slug form claims the
                UNCLAIMED status page it names — open claim, first caller
                wins: the conditional burn is the lock.
              properties:
                claimToken: { type: string }
                slug: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [claimed]
                properties:
                  claimed: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/install/status:
    get:
      tags: [install]
      security:
        - apiKey: []
      x-hand-written: true
      summary: |
        What `npx upcontrol verify` polls (cli/SPEC.md §8): key-authenticated
        (X-Upcontrol-Key or Bearer), answers whether install_verified has
        arrived inside the visible window, how many lines the window holds, and
        which message names arrived in the last 15 minutes — enough to tell
        "key never worked" from "points placed in code that has not run" from
        "names drifted off the dictionary".
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [verified, lines, recent]
                properties:
                  verified: { type: boolean }
                  verifiedAt: { type: string, format: date-time }
                  lines: { type: integer }
                  recent:
                    type: array
                    items:
                      type: object
                      required: [name, count, lastAt]
                      properties:
                        name: { type: string }
                        count: { type: integer }
                        lastAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/install/token:
    post:
      tags: [install]
      x-hand-written: true
      summary: |
        Mint the one-time install token the dashboard's install card embeds in
        `npx upcontrol init --token ...` (front-distribution-alignment.md §1).
        Session-authed; bound to the session's project; TTL 10 minutes;
        single-use. The dashboard never shows a bare `npx upcontrol` — signed
        out of the terminal it would mint an anonymous project and route this
        account's logs past it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token, command, expiresAt]
                properties:
                  token: { type: string }
                  command: { type: string }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/install/redeem:
    post:
      tags: [install]
      security: []
      x-hand-written: true
      summary: |
        Burn an install token and issue an ADDITIONAL api_key for its project,
        returning the secret exactly once (the CLI writes it into .env and
        never prints it). Not a rotation - nothing deployed breaks. A spent,
        expired or unknown token all answer the same 404. Per-IP throttled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key: { type: string, description: Shown exactly once. }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # --- hand-written (exist here for /docs/api; implemented by hand) --------
  /i:
    post:
      tags: [ingest]
      summary: |
        The schemaless ingest endpoint. Body form is decided by a sniffer, not a
        header. Always 2xx on sane input with a structured receipt; 401/429/503
        only. Implemented by hand — the generator's validation is forbidden.

        A JSON line may carry an optional boolean field `uc.event`: true means
        the sender is declaring an event name (the message) rather than sending
        a log message. Unmarked lines are identified by their fingerprint, not
        by a name. The `uc.` prefix is reserved.
      security:
        - apiKey: []
      x-hand-written: true
      requestBody:
        required: true
        content:
