  /i:
    post:
      tags: [ingest]
      summary: |
        The schemaless ingest endpoint. Body form is decided by a sniffer, not a
        header. Always 2xx on sane input with a structured receipt; 401/429/503
        only. Implemented by hand — the generator's validation is forbidden.
      security:
        - apiKey: []
      x-hand-written: true
      requestBody:
        required: true
        content:
          application/json:
            { schema: { type: object, additionalProperties: true } }
          application/x-ndjson: { schema: { type: string } }
          text/plain: { schema: { type: string } }
      responses:
        "200":
          description: Accepted
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/IngestReceipt" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Spool full (always with Retry-After).
          headers:
            Retry-After: { schema: { type: string } }

  /v1/event:
    post:
      tags: [ingest]
      summary: |
        The ingest endpoint the docs promise (audit §6): an alias over the same
        pipeline as POST /i — spool, WAL, batcher, ClickHouse — never a second
        one. The key is accepted "anywhere", literally: Authorization: Bearer,
        ?key=, or a top-level `key` field in the body, whichever is found first.
        The body is any shape the /i sniffer knows (NDJSON, JSON array, JSON
        object, plain text, syslog, OTLP, Sentry, Alertmanager, Loki) and answers
        with the same receipt. Implemented by hand, exactly like /i.
      security:
        - apiKey: []
      x-hand-written: true
      requestBody:
        required: true
        content:
