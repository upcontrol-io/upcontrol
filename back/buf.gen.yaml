version: v2
clean: false
# No managed mode: the proto carries an explicit go_package that already agrees
# with the source_relative output path (gen/rpc/probe/v1), so managed rewriting
# would only desync the message-package import the connect plugin emits.
# Pinned to the versions go.mod carries: an unpinned remote plugin moves under us, and the
# drift check then fails on a change that touched no proto (connect-go, 2026-10-13).
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/rpc
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: gen/rpc
    opt: paths=source_relative
